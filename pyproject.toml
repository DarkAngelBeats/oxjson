[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oxjson"
version = "0.4.1"
description = "Fast JSON for CPython: orjson-compatible loads/dumps with an x86-64 NASM kernel and portable C fallback"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
license-files = ["LICENSE", "THIRD_PARTY.md", "licenses/*"]
authors = [{ name = "Lev Berezkin" }]
keywords = ["json", "orjson", "simd", "avx2", "nasm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
urls = { Homepage = "https://github.com/DarkAngelBeats/oxjson", Repository = "https://github.com/DarkAngelBeats/oxjson", Issues = "https://github.com/DarkAngelBeats/oxjson/issues" }

[tool.setuptools]
packages = ["oxjson"]
include-package-data = true

[tool.setuptools.package-data]
oxjson = ["*.pyi", "py.typed"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-win32 *_i686"
test-command = "python -c \"import oxjson; assert oxjson.loads(b'{\\\"a\\\":1}') == {'a': 1}\""
test-skip = "*-macosx_x86_64"  # optional runners may be scarce; arm64 is enough

[tool.cibuildwheel.linux]
# NASM is only needed for the x86-64 kernel; aarch64 builds the portable C code
before-all = """
case "$(uname -m)" in
  x86_64) ;;
  *) echo "no NASM needed on $(uname -m)"; exit 0 ;;
esac
if command -v yum >/dev/null 2>&1; then yum install -y nasm
elif command -v dnf >/dev/null 2>&1; then dnf install -y nasm
elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y nasm
elif command -v apk >/dev/null 2>&1; then apk add --no-cache nasm
else echo 'no package manager for nasm' >&2; exit 1
fi
"""

[tool.cibuildwheel.macos]
# portable C path only (no NASM kernel on macOS in make_ext.py);
# x86_64 is cross-compiled on the arm64 runner via $ARCHFLAGS
archs = ["arm64", "x86_64"]
environment = { CC = "clang" }
