name: wheels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cibuildwheel
        run: python -m pip install -U pip cibuildwheel
      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: wheelhouse/*.whl

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cibuildwheel
        run: python -m pip install -U pip cibuildwheel
      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: wheelhouse/*.whl

  # Full NEON / portable-path suite on Apple Silicon (not just wheel smoke).
  test-macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: python -m pip install -U pip -r requirements-dev.txt
      - name: Run full suite
        run: python tests/run_all.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-macos-py${{ matrix.python-version }}
          path: |
            report-*.txt
            bench/results/*.json

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NASM and MinGW
        shell: bash
        run: |
          choco install nasm mingw -y --no-progress
          echo "C:/Program Files/NASM" >> "$GITHUB_PATH"
          echo "C:/ProgramData/mingw64/mingw64/bin" >> "$GITHUB_PATH"
          echo "C:/MinGW/bin" >> "$GITHUB_PATH"
      - name: Find gcc
        shell: bash
        run: |
          export PATH="/c/Program Files/NASM:/c/ProgramData/mingw64/mingw64/bin:/c/MinGW/bin:$PATH"
          which nasm
          which gcc
          nasm -v
          gcc --version | head -1
      - name: Build wheel
        shell: bash
        run: |
          export PATH="/c/Program Files/NASM:/c/ProgramData/mingw64/mingw64/bin:/c/MinGW/bin:$PATH"
          export CC=gcc
          python -m pip install -U pip build
          python -m build --wheel -o wheelhouse
      - name: Smoke test
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-index --find-links=wheelhouse oxjson
          # import from outside the repo so the local oxjson/ package does not shadow the wheel
          cd "$RUNNER_TEMP"
          python -c "import oxjson; assert oxjson.loads(b'{\"a\":1}')=={'a':1}"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y nasm
          python -m pip install -U pip build
          python -m build --sdist -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
